
name: Extract MyWallet Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          mkdir -p /tmp/mywallet-source
          unzip -q MyWallet-source.zip -d /tmp/mywallet-source

          PROJECT_DIR=$(find /tmp/mywallet-source -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json tidak ditemukan"
            exit 1
          fi

          cp -R "$PROJECT_DIR"/. .
          rm MyWallet-source.zip

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add MyWallet application source"
          git push
